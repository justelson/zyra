name: Desktop CI
run-name: Full checks ${{ inputs.source_sha }}

# Full native verification is explicitly requested. The relay routes normal PR
# changes to helper-checks.yml, which never builds an installer.
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public source repository
        required: true
        default: justelson/zyra
        type: string
      source_sha:
        description: Exact source commit for the full native checks
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  native-checks:
    name: ${{ matrix.platform }} native checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
          - platform: macos
            os: macos-15
          - platform: linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Validate source request
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ALLOWED_SOURCE: ${{ vars.ZYRA_SOURCE_REPOSITORY || 'justelson/zyra' }}
        run: |
          test "$SOURCE_REPOSITORY" = "$ALLOWED_SOURCE"
          test "$GITHUB_REPOSITORY" != "$ALLOWED_SOURCE"
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Set up Bun 1.3.9
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET 8 on Windows
        if: matrix.platform == 'windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Desktop dependencies and validate node-pty
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Validate release and updater contracts
        run: npm --prefix desktop run test:release-infra

      - name: Validate onboarding, account, provider, and native behavior
        run: npm --prefix desktop run test:release-readiness

      - name: Generate and validate native icon families
        run: npm --prefix desktop run brand:release-assets && npm --prefix desktop run test:branding

      - name: Prepare native release resources
        run: npm --prefix desktop run release:prepare -- --platform=${{ matrix.platform }}

      - name: Validate packaged runtime
        run: npm --prefix desktop run runtime:validate && npm --prefix desktop run test:packaged-runtime

      - name: Validate browser extension
        run: |
          npm --prefix extensions/zyra-browser-control ci --no-audit --no-fund
          npm --prefix extensions/zyra-browser-control run typecheck
          npm --prefix extensions/zyra-browser-control test

      - name: Smoke node-pty under pinned Electron
        run: npm --prefix desktop run test:native-abi

      - name: Typecheck Desktop and Browser runtime
        run: npm --prefix desktop run typecheck && npm --prefix desktop run typecheck:browser-runtime

      - name: Test Windows sidecar
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet build native/zyra-computer-use/tests/Zyra.ComputerUse.Tests/Zyra.ComputerUse.Tests.csproj -c Release
          dotnet run --project native/zyra-computer-use/tests/Zyra.ComputerUse.Tests/Zyra.ComputerUse.Tests.csproj -c Release --no-build

      - name: Run full repository check once
        if: matrix.platform == 'linux'
        run: npm run check

      - name: Verify canonical generated branding
        if: matrix.platform == 'linux'
        shell: bash
        run: git diff --exit-code -- desktop/resources

      - name: Verify patch whitespace
        shell: bash
        run: git diff --check
