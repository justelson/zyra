name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Lockstep Zyra version to rehearse from master
        required: true
        default: "0.6.1"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.release_contract.outputs.version }}
      tag: ${{ steps.release_contract.outputs.tag }}
      head: ${{ steps.release_contract.outputs.head }}
      publish: ${{ steps.release_contract.outputs.publish }}
      require_signing: ${{ steps.release_contract.outputs.require_signing }}
    steps:
      - name: Check out full release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Set up Bun 1.3.9
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Enforce tag, version, HEAD, master, and signing gates
        id: release_contract
        env:
          ZYRA_WINDOWS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.ZYRA_WINDOWS_CERTIFICATE || '' }}
          ZYRA_WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.ZYRA_WINDOWS_CERTIFICATE_PASSWORD || '' }}
          ZYRA_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ github.event_name == 'push' && secrets.ZYRA_WINDOWS_CERTIFICATE_THUMBPRINT || '' }}
          ZYRA_MACOS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.ZYRA_MACOS_CERTIFICATE || '' }}
          ZYRA_MACOS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.ZYRA_MACOS_CERTIFICATE_PASSWORD || '' }}
          ZYRA_MACOS_TEAM_ID: ${{ github.event_name == 'push' && secrets.ZYRA_MACOS_TEAM_ID || '' }}
          ZYRA_MACOS_NOTARIZATION_API_KEY: ${{ github.event_name == 'push' && secrets.ZYRA_MACOS_NOTARIZATION_API_KEY || '' }}
          ZYRA_MACOS_NOTARIZATION_KEY_ID: ${{ github.event_name == 'push' && secrets.ZYRA_MACOS_NOTARIZATION_KEY_ID || '' }}
          ZYRA_MACOS_NOTARIZATION_ISSUER_ID: ${{ github.event_name == 'push' && secrets.ZYRA_MACOS_NOTARIZATION_ISSUER_ID || '' }}
          EVS_ACCOUNT_NAME: ${{ github.event_name == 'push' && secrets.EVS_ACCOUNT_NAME || '' }}
          EVS_PASSWD: ${{ github.event_name == 'push' && secrets.EVS_PASSWD || '' }}
          ZYRA_ACCEPT_ECS_SECURITY_DELTA: ${{ github.event_name == 'push' && secrets.ZYRA_ACCEPT_ECS_SECURITY_DELTA || '' }}
          EXPECTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            node desktop/scripts/release/preflight.mjs --mode=tag --tag="${GITHUB_REF_NAME}"
          else
            node desktop/scripts/release/preflight.mjs --mode=rehearsal --ref-name="${GITHUB_REF_NAME}" --expected-version="${EXPECTED_VERSION}"
          fi

      - name: Run focused release contracts
        run: npm --prefix desktop run test:release-infra

      - name: Run onboarding, account, provider, and native readiness contracts
        run: npm --prefix desktop run test:release-readiness

      - name: Run public privacy gate
        run: npm run privacy-check

      - name: Run repository check
        run: npm run check

      - name: Verify clean patch formatting
        shell: bash
        run: git diff --check

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
          - platform: macos
            os: macos-15
          - platform: linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      ZYRA_EXPECT_SIGNED: ${{ needs.preflight.outputs.require_signing == 'true' && matrix.platform != 'linux' && '1' || '0' }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Set up Bun 1.3.9
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET 8 for Windows sidecar
        if: matrix.platform == 'windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Install Widevine VMP signing client
        if: needs.preflight.outputs.require_signing == 'true' && matrix.platform != 'linux'
        run: python -m pip install --disable-pip-version-check castlabs-evs==1.3.2

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Desktop dependencies and validate node-pty
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Generate and validate native icons
        run: npm --prefix desktop run brand:release-assets && npm --prefix desktop run test:branding

      - name: Smoke node-pty under Electron
        run: npm --prefix desktop run test:native-abi

      - name: Smoke Widevine protected media
        if: matrix.platform != 'linux'
        run: npm --prefix desktop run smoke:protected-media

      - name: Build native package and updater metadata
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_LINK: ${{ needs.preflight.outputs.require_signing == 'true' && matrix.platform == 'windows' && secrets.ZYRA_WINDOWS_CERTIFICATE || needs.preflight.outputs.require_signing == 'true' && matrix.platform == 'macos' && secrets.ZYRA_MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ needs.preflight.outputs.require_signing == 'true' && matrix.platform == 'windows' && secrets.ZYRA_WINDOWS_CERTIFICATE_PASSWORD || needs.preflight.outputs.require_signing == 'true' && matrix.platform == 'macos' && secrets.ZYRA_MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_CONTENT: ${{ needs.preflight.outputs.require_signing == 'true' && matrix.platform == 'macos' && secrets.ZYRA_MACOS_NOTARIZATION_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ needs.preflight.outputs.require_signing == 'true' && matrix.platform == 'macos' && secrets.ZYRA_MACOS_NOTARIZATION_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.preflight.outputs.require_signing == 'true' && matrix.platform == 'macos' && secrets.ZYRA_MACOS_NOTARIZATION_ISSUER_ID || '' }}
          EVS_ACCOUNT_NAME: ${{ needs.preflight.outputs.publish == 'true' && matrix.platform != 'linux' && secrets.EVS_ACCOUNT_NAME || '' }}
          EVS_PASSWD: ${{ needs.preflight.outputs.publish == 'true' && matrix.platform != 'linux' && secrets.EVS_PASSWD || '' }}
        run: |
          key_path=""
          cleanup() { if [[ -n "${key_path}" ]]; then rm -f "${key_path}"; fi; }
          trap cleanup EXIT
          if [[ "${{ needs.preflight.outputs.require_signing }}" == "true" && "${{ matrix.platform }}" == "macos" ]]; then
            key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}_desktop.p8"
            printf '%s' "${APPLE_API_KEY_CONTENT}" > "${key_path}"
            chmod 600 "${key_path}"
            export APPLE_API_KEY="${key_path}"
          fi
          npm --prefix desktop run release:package -- --platform=${{ matrix.platform }}

      - name: Revalidate native upload set
        run: >-
          node desktop/scripts/release/validate-release-assets.mjs
          --platform=${{ matrix.platform }}
          --version=${{ needs.preflight.outputs.version }}
          --dir=desktop/dist/releases/v${{ needs.preflight.outputs.version }}/${{ matrix.platform }}/upload
          --exact=true

      - name: Build standalone TUI binaries
        shell: bash
        run: |
          output="dist/tui/v${{ needs.preflight.outputs.version }}"
          case "${{ matrix.platform }}" in
            windows)
              node scripts/build-tui-release.mjs --target=windows-x64 --version=${{ needs.preflight.outputs.version }} --output="${output}"
              ;;
            macos)
              node scripts/build-tui-release.mjs --target=macos-arm64 --version=${{ needs.preflight.outputs.version }} --output="${output}"
              node scripts/build-tui-release.mjs --target=macos-x64 --version=${{ needs.preflight.outputs.version }} --output="${output}"
              ;;
            linux)
              node scripts/build-tui-release.mjs --target=linux-x64 --version=${{ needs.preflight.outputs.version }} --output="${output}"
              ;;
          esac

      - name: Sign and verify standalone TUI binaries
        if: needs.preflight.outputs.require_signing == 'true' && matrix.platform != 'linux'
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'windows' && secrets.ZYRA_WINDOWS_CERTIFICATE || secrets.ZYRA_MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.ZYRA_WINDOWS_CERTIFICATE_PASSWORD || secrets.ZYRA_MACOS_CERTIFICATE_PASSWORD }}
          ZYRA_WINDOWS_EXPECTED_THUMBPRINT: ${{ matrix.platform == 'windows' && secrets.ZYRA_WINDOWS_CERTIFICATE_THUMBPRINT || '' }}
          ZYRA_MACOS_EXPECTED_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.ZYRA_MACOS_TEAM_ID || '' }}
          APPLE_API_KEY_CONTENT: ${{ matrix.platform == 'macos' && secrets.ZYRA_MACOS_NOTARIZATION_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'macos' && secrets.ZYRA_MACOS_NOTARIZATION_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.ZYRA_MACOS_NOTARIZATION_ISSUER_ID || '' }}
        run: |
          key_path=""
          cleanup() { if [[ -n "${key_path}" ]]; then rm -f "${key_path}"; fi; }
          trap cleanup EXIT
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}_tui.p8"
            printf '%s' "${APPLE_API_KEY_CONTENT}" > "${key_path}"
            chmod 600 "${key_path}"
            export APPLE_API_KEY="${key_path}"
          fi
          node scripts/sign-standalone-tui.mjs \
            --platform=${{ matrix.platform }} \
            --version=${{ needs.preflight.outputs.version }} \
            --dir=dist/tui/v${{ needs.preflight.outputs.version }} \
            --marker=desktop/dist/releases/v${{ needs.preflight.outputs.version }}/${{ matrix.platform }}/.verification/${{ matrix.platform }}.json

      - name: Smoke native standalone TUI
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows) binary="dist/tui/v${{ needs.preflight.outputs.version }}/Zyra-TUI-${{ needs.preflight.outputs.version }}-windows-x64.exe" ;;
            macos)
              node scripts/test-standalone-tui-binary.mjs "dist/tui/v${{ needs.preflight.outputs.version }}/Zyra-TUI-${{ needs.preflight.outputs.version }}-macos-arm64" "${{ needs.preflight.outputs.version }}"
              node scripts/test-standalone-tui-binary.mjs "dist/tui/v${{ needs.preflight.outputs.version }}/Zyra-TUI-${{ needs.preflight.outputs.version }}-macos-x64" "${{ needs.preflight.outputs.version }}"
              exit 0
              ;;
            linux) binary="dist/tui/v${{ needs.preflight.outputs.version }}/Zyra-TUI-${{ needs.preflight.outputs.version }}-linux-x64" ;;
          esac
          node scripts/test-standalone-tui-binary.mjs "${binary}" "${{ needs.preflight.outputs.version }}"

      - name: Upload isolated native assets
        uses: actions/upload-artifact@v4
        with:
          name: zyra-desktop-assets-${{ matrix.platform }}
          path: desktop/dist/releases/v${{ needs.preflight.outputs.version }}/${{ matrix.platform }}/upload/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload native verification marker
        uses: actions/upload-artifact@v4
        with:
          name: zyra-desktop-verification-${{ matrix.platform }}
          path: desktop/dist/releases/v${{ needs.preflight.outputs.version }}/${{ matrix.platform }}/.verification/${{ matrix.platform }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone TUI assets
        uses: actions/upload-artifact@v4
        with:
          name: zyra-tui-assets-${{ matrix.platform }}
          path: dist/tui/v${{ needs.preflight.outputs.version }}/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble and verify release assets
    needs:
      - preflight
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Download every native asset set
        uses: actions/download-artifact@v4
        with:
          pattern: zyra-desktop-assets-*
          path: release-assets
          merge-multiple: true

      - name: Download every native verification marker
        uses: actions/download-artifact@v4
        with:
          pattern: zyra-desktop-verification-*
          path: release-verification
          merge-multiple: true

      - name: Download every standalone TUI asset
        uses: actions/download-artifact@v4
        with:
          pattern: zyra-tui-assets-*
          path: release-assets
          merge-multiple: true

      - name: Validate complete matrix and generate checksums
        run: >-
          node desktop/scripts/release/validate-release-assets.mjs
          --platform=all
          --version=${{ needs.preflight.outputs.version }}
          --dir=release-assets
          --write-checksums=true
          --exact=true

      - name: Validate signing/notarization evidence
        run: >-
          node desktop/scripts/release/validate-signature-markers.mjs
          --dir=release-verification
          --assets-dir=release-assets
          --version=${{ needs.preflight.outputs.version }}
          --windows-thumbprint=${{ secrets.ZYRA_WINDOWS_CERTIFICATE_THUMBPRINT }}
          --macos-team-id=${{ secrets.ZYRA_MACOS_TEAM_ID }}
          --require-signing=${{ needs.preflight.outputs.require_signing }}

      - name: Upload verified rehearsal/release bundle
        uses: actions/upload-artifact@v4
        with:
          name: zyra-desktop-${{ needs.preflight.outputs.version }}-all-platforms
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create verified draft; publish only signed tags
    needs:
      - preflight
      - assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.tag || format('rehearsal-{0}-{1}', needs.preflight.outputs.tag, github.run_id) }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.head }}
      RELEASE_PUBLISH: ${{ needs.preflight.outputs.publish }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Download verified assembled bundle
        uses: actions/download-artifact@v4
        with:
          name: zyra-desktop-${{ needs.preflight.outputs.version }}-all-platforms
          path: release-assets

      - name: Revalidate local release bundle
        run: >-
          node desktop/scripts/release/validate-release-assets.mjs
          --platform=all
          --version=${RELEASE_VERSION}
          --dir=release-assets
          --checksums=true
          --exact=true

      - name: Generate release notes
        shell: bash
        run: node desktop/scripts/maint/generate-release-notes.mjs > release-notes.md

      - name: Create or verify the private draft
        id: draft
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            if [[ "${is_draft}" != "true" ]]; then
              echo "Release ${RELEASE_TAG} is already public; refusing to replace it."
              exit 1
            fi
            echo "Reusing existing unpublished draft ${RELEASE_TAG}."
          else
            create_args=(
              "${RELEASE_TAG}"
              --repo "${GITHUB_REPOSITORY}"
              --target "${RELEASE_SHA}"
              --title "Zyra ${RELEASE_TAG}"
              --notes-file release-notes.md
              --draft
            )
            if [[ "${RELEASE_PUBLISH}" == "true" ]]; then
              create_args+=(--verify-tag)
            fi
            gh release create "${create_args[@]}"
          fi
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --title "Zyra ${RELEASE_TAG}" --notes-file release-notes.md

      - name: Upload the complete verified bundle to the draft
        shell: bash
        run: gh release upload "${RELEASE_TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Re-read and validate draft assets
        shell: bash
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,targetCommitish,assets > github-draft.json
          node desktop/scripts/release/validate-github-draft.mjs --file=github-draft.json --version="${RELEASE_VERSION}" --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}" --branch=master --local-dir=release-assets
          mkdir github-assets
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir github-assets
          node desktop/scripts/release/validate-release-assets.mjs --platform=all --version="${RELEASE_VERSION}" --dir=github-assets --checksums=true --exact=true

      - name: Keep unsigned workflow-dispatch builds unpublished
        if: needs.preflight.outputs.publish != 'true'
        shell: bash
        run: |
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = "true"
          echo "Unsigned native build remains in the private ${RELEASE_TAG} GitHub draft."

      - name: Publish only the signed and notarized tagged candidate
        if: needs.preflight.outputs.publish == 'true'
        shell: bash
        run: |
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease
          else
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
          fi
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = "false"
