name: Windows preview
run-name: Preview ${{ inputs.source_sha }}

# Installer work is explicit. Pushes, PR updates and comments never start it.
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public source repository
        required: true
        default: justelson/zyra
        type: string
      source_sha:
        description: Full 40-character source commit to install and test
        required: true
        type: string

permissions:
  contents: read

# A new explicit request supersedes an older preview. There are no auto-retries.
concurrency:
  group: windows-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Requested Windows installer
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      ZYRA_BUILD_DISTRIBUTION: preview
      ZYRA_BUILD_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      ZYRA_BUILD_SOURCE_SHA: ${{ inputs.source_sha }}
      ZYRA_EXPECT_SIGNED: '0'
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: source
    steps:
      - name: Validate request before checkout
        working-directory: .
        shell: pwsh
        env:
          ALLOWED_SOURCE: ${{ vars.ZYRA_SOURCE_REPOSITORY || 'justelson/zyra' }}
        run: |
          if ($env:ZYRA_BUILD_SOURCE_REPOSITORY -ne $env:ALLOWED_SOURCE) { throw 'Source repository is not allowlisted.' }
          if ($env:GITHUB_REPOSITORY -eq $env:ALLOWED_SOURCE) { throw 'Preview builds run in the helper repository, not the source account.' }
          if ($env:ZYRA_BUILD_SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'An exact source commit is required.' }

      - name: Check out trusted workflow tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Set up Bun 1.3.9
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare isolated preview version
        run: node ../control/desktop/scripts/release/build-preview.mjs prepare .

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Check preview isolation contracts
        run: npm --prefix desktop run test:preview-infra

      - name: Typecheck packaged Desktop contracts
        run: npm --prefix desktop run typecheck

      - name: Verify public source privacy
        run: npm run privacy-check

      - name: Verify native terminal ABI
        run: npm --prefix desktop run test:native-abi

      - name: Prepare native icons
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 && npm --prefix desktop run brand:release-assets

      - name: Build and validate personal preview
        run: node ../control/desktop/scripts/release/build-preview.mjs build .

      - name: Upload installer and checksums
        id: installer
        uses: actions/upload-artifact@v4
        with:
          name: zyra-preview-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/desktop/dist/previews/${{ github.run_id }}/upload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload small provenance record
        uses: actions/upload-artifact@v4
        with:
          name: zyra-preview-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/desktop/dist/previews/${{ github.run_id }}/upload/preview.json
            source/desktop/dist/previews/${{ github.run_id }}/upload/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      - name: Show download and source identity
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.installer.outputs.artifact-url }}
        run: |
          $manifest = Get-Content "desktop/dist/previews/$env:GITHUB_RUN_ID/upload/preview.json" -Raw | ConvertFrom-Json
          "## Personal Windows preview" >> $env:GITHUB_STEP_SUMMARY
          "[Download installer ZIP]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Source: ``$env:ZYRA_BUILD_SOURCE_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "Version: ``$($manifest.version)``" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: ``$($manifest.installer.sha256)``" >> $env:GITHUB_STEP_SUMMARY
          "Unsigned personal test build. Install Zyra Preview beside stable. Artifact expires after one day; the installed app does not expire." >> $env:GITHUB_STEP_SUMMARY
